[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qivra-static-analyzer"
version = "0.2.0"
description = "Static Maven and Gradle repository inventory for QIVRA"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
qivra-analyzer = "qivra_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qivra_analyzer*"]
