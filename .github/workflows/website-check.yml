name: Website checks

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/website/**"
      - "package.json"
      - ".github/workflows/website-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/website/**"
      - "package.json"
      - ".github/workflows/website-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run browser quality checks
        run: npm run test:e2e

      - name: Upload generated npm lockfile for initial capture
        uses: actions/upload-artifact@v4
        with:
          name: qivra-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
