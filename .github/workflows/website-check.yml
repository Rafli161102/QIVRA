name: Website checks

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Capture initial npm lockfile for the release-readiness PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/website-release-readiness' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;

            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path: "package-lock.json",
                ref: branch,
              });
              core.info("package-lock.json already exists on the PR branch; no commit needed.");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const content = fs.readFileSync("package-lock.json", "base64");
            const result = await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "package-lock.json",
              message: "chore(deps): add npm workspace lockfile",
              content,
              branch,
            });
            core.info(`Committed package-lock.json: ${result.data.commit.sha}`);

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run browser quality checks
        run: npm run test:e2e
